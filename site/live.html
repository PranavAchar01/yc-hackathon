<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Run</title>
<meta name="description" content="Watch an Over the Shoulder agent work in a real browser, live, then its replay.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0b0c;--ink:#f5f5f7;--ink2:#a1a1a6;--live:#ff3b30;--veil:rgba(20,20,22,.58)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:fixed;inset:0}
canvas,video{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
video{object-fit:contain;opacity:0;transition:opacity .6s ease}
video.on{opacity:1}
canvas{opacity:0;transition:opacity .4s ease}
canvas.on{opacity:1}
.stopped canvas{filter:saturate(.4) brightness(.7)}
.wait{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;color:var(--ink2);font-size:13px;letter-spacing:.01em;transition:opacity .4s ease}
.wait.off{opacity:0;pointer-events:none}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.7);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{position:absolute;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 10px;border-radius:999px;background:var(--veil);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);font-size:12px;font-weight:600;letter-spacing:.02em;opacity:0;transition:opacity .35s ease;white-space:nowrap}
.pill.on{opacity:1}
#state{left:12px;top:12px;letter-spacing:.06em}
#step{left:12px;bottom:12px;font-weight:500;font-variant-numeric:tabular-nums;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-out infinite}
.tri{width:0;height:0;border-left:7px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.55)}70%{box-shadow:0 0 0 7px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Live view of the agent's browser"></canvas>
  <video id="v" playsinline muted loop preload="auto" aria-label="Replay of the run"></video>
  <div class="wait" id="wait"><div class="ring"></div><div id="msg"></div></div>
  <div class="pill" id="state"><span class="dot" id="icon"></span><span id="label">LIVE</span></div>
  <div class="pill" id="step"></div>
</div>
<script>
// Live, then replay, in one place. While the run is going it polls the relay (~8/s) and crossfades each new
// frame in; when the run ends it fades into the replay video, which loops. Opened after the run: the replay.
(() => {
  const run = new URLSearchParams(location.search).get("run") || "";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), canvas = $("c"), ctx = canvas.getContext("2d"), video = $("v");
  const wait = $("wait"), msg = $("msg"), statePill = $("state"), icon = $("icon"), label = $("label"), stepPill = $("step");
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(run)) { msg.textContent = "No run to show"; wait.querySelector(".ring").remove(); return; }
  const url = `/api/live/${encodeURIComponent(run)}?frame=1`;
  let etag = "", state = "live", replayUrl = "", misses = 0, replaying = false;

  // Two-frame crossfade: the previous frame stays under the new one while it fades in over 180 ms.
  let prev = null, cur = null, fadeStart = 0;
  const FADE = 180;
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    return [w, h];
  }
  function draw(bmp, alpha, w, h) {
    const s = Math.min(w / bmp.width, h / bmp.height), dw = bmp.width * s, dh = bmp.height * s;
    ctx.globalAlpha = alpha;
    ctx.drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }
  function frame() {
    if (!cur) return;
    const [w, h] = size();
    const p = Math.min(1, (performance.now() - fadeStart) / FADE);
    ctx.globalAlpha = 1; ctx.fillStyle = "#0b0b0c"; ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = "high";
    if (prev && p < 1) draw(prev, 1, w, h);
    draw(cur, prev ? p : 1, w, h);
    ctx.globalAlpha = 1;
    if (p < 1) requestAnimationFrame(frame);
    else if (prev) { prev.close?.(); prev = null; }
  }
  addEventListener("resize", () => { fadeStart = 0; frame(); });

  function show(text, cls) {
    label.textContent = text;
    icon.className = cls;
    statePill.classList.add("on");
  }
  function startReplay() {
    if (replaying || !replayUrl) return;
    replaying = true;
    video.src = replayUrl;
    video.addEventListener("canplay", () => {
      video.play().catch(() => {});
      video.classList.add("on");
      wait.classList.add("off");
      stepPill.classList.remove("on");
      show("REPLAY", "tri");
    }, { once: true });
  }
  video.addEventListener("click", () => (video.paused ? video.play() : video.pause()));

  async function tick() {
    let delay = document.hidden ? 1000 : 125;
    try {
      const r = await fetch(url, { cache: "no-store", headers: etag ? { "if-none-match": etag } : {} });
      if (r.status === 404) {
        misses++;
        msg.textContent = "Starting the agent";
        if (misses > 60) { msg.textContent = "This run has ended"; wait.querySelector(".ring")?.remove(); return; }
      } else if (r.ok || r.status === 304) {
        misses = 0;
        state = r.headers.get("x-state") || state;
        replayUrl = r.headers.get("x-replay") || replayUrl;
        const step = r.headers.get("x-step");
        if (step && state === "live") { stepPill.textContent = decodeURIComponent(step); stepPill.classList.add("on"); }
        if (r.status === 200) {
          etag = r.headers.get("etag") || "";
          const bmp = await createImageBitmap(await r.blob());
          if (cur) { prev?.close?.(); prev = cur; }
          cur = bmp; fadeStart = performance.now();
          requestAnimationFrame(frame);
          canvas.classList.add("on");
          if (state === "live") wait.classList.add("off");
        }
        if (state === "live") show("LIVE", "dot");
        else if (state === "failed") { stage.classList.add("stopped"); show("STOPPED", ""); stepPill.classList.remove("on"); wait.classList.add("off"); }
        else if (replayUrl) startReplay();
        else { show("DONE", "tri"); stepPill.classList.remove("on"); }
        if (state === "failed" || replaying) return; // nothing left to poll for
        if (state === "done") delay = 1000; // waiting for the replay to be ready
      }
    } catch { /* network blip: keep polling */ }
    setTimeout(tick, delay);
  }
  tick();
})();
</script>
</body>
</html>
